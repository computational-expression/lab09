# GatorGrade Configuration for Lab 09 with CLO/PLO Mappings

setup: |
  echo "No additional setup required for this lab"

targets:
  PLO1:
    - I: 80
  PLO2:
    - I: 80
  PLO4:
    - I: 80

thresholds:
  PLO1:
    - I: 10
  PLO2:
    - I: 5
  PLO4:
    - I: 8

