# GatorGrade Configuration for Lab 09 with CLO/PLO Mappings

setup: |
  echo "No additional setup required for this lab"

targets:
  PLO1:
    - I: 80
  PLO2:
    - I: 80
  PLO4:
    - I: 80

thresholds:
  PLO1:
    - I: 10
  PLO2:
    - I: 5
  PLO4:
    - I: 8

---

# Check Python syntax is valid
- description: Python syntax is valid in environment_sensor.py
  check: ExecuteCommand
  options:
    command: "python3 -m py_compile src/environment_sensor.py"
  objectives:
    CLO2:
      degree:
        - CS: "I"
          rationale: "Using industry-standard tools (py_compile) to verify code quality"
        - SE: "I"
          rationale: "Using industry-standard tools (py_compile) to verify code quality"
- description: Python syntax is valid in dashboard_controller.py
  check: ExecuteCommand
  options:
    command: "python3 -m py_compile src/dashboard_controller.py"
  objectives:
    CLO2:
      degree:
        - CS: "I"
          rationale: "Using industry-standard tools (py_compile) to verify code quality"
        - SE: "I"
          rationale: "Using industry-standard tools (py_compile) to verify code quality"

