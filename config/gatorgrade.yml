# GatorGrade Configuration for Lab 09 Solution

# Run assessment tests to verify class correctness
- description: assessment.py verifies all class implementations are correct
  check: MatchCommandFragment
  options:
    command: "cd src && python assessment.py"
    fragment: "ASSESSMENT RESULT: All tests passed / True"
    count: 1
    exact: true

